<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Babylon Advisor</title>

  <!-- Tailwind via Script (Development) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            indigo: {
              50: '#e1f0fa',
              100: '#b4d8f1',
              200: '#87bfe8',
              300: '#5dade2',
              400: '#46a5e5',
              500: '#3498db',
              600: '#2980b9',
              700: '#21618c',
              800: '#1a4c6e',
              900: '#154360',
              950: '#0e2d42',
            },
            slate: {
              50: '#ecf0f1',
              100: '#e5e8e8',
              200: '#bdc3c7',
              300: '#aab7b8',
              400: '#95a5a6',
              500: '#7f8c8d',
              600: '#5d6d7e',
              700: '#34495e',
              800: '#2e4053',
              900: '#2c3e50',
              950: '#1a252f',
            }
          }
        },
      },
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/index.css">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    .light ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }

    .dark ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
      border: 2px solid #0f172a;
      /* Matches slate-900 */
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    .dark ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }
  </style>
</head>

<body
  class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased selection:bg-indigo-500 selection:text-white">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
